baseURL = "https://go-quake3.github.io/"
title = "go-quake3"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

# Only the brand card today — engine work has not started; org is reserved.
[[params.repos]]
  name = "brand"
  accel = "Logos, favicons, social previews"
  kind = "brand"
  result = "Brand assets — SVG / PNG / JPG / ICO / ICNS in color, white-transparent and black-transparent variants. Staked out so the go-quake1 / 2 / 3 family is visually coherent the day the Q3 port starts."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 14.26:1, bright on the dark background 4.21:1.
  base = "#5a0808"
  deep = "#370505"
  bright = "#e81818"
  shadow = "rgba(90,8,8,.7)"
  glow = "rgba(90,8,8,.6)"
  wash = "rgba(90,8,8,.10)"
  washDeep = "rgba(55,5,5,.06)"
  chipBg = "#fce3e3"
  chipBorder = "#f8baba"
  chipFg = "#370505"
  chipBgDark = "rgba(232,24,24,.14)"
  chipBorderDark = "rgba(232,24,24,.32)"
  chipFgDark = "#f28080"
  statsEnd = "#f9c8c8"
  bandText = "#fbdada"
